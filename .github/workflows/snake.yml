name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate the purple snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: oussamasaidguerni-cyber
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=8A2BE2

      - name: Publish to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: dist
          destination_dir: .
          commit_message: Update snake animation