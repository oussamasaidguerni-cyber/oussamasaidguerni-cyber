<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Usamasg fastfetch, dream kanji">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0718"/>
      <stop offset="0.5" stop-color="#241048"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="dream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4a5fc"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <rect width="900" height="300" fill="url(#bg)"/>

  <text x="170" y="225" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="190" font-weight="700" fill="url(#dream)">&#x5922;</text>
  <text x="170" y="268" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="15" letter-spacing="4" fill="#8a2be2">yume &#8212; dream</text>

  <g font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="15">
    <text x="400" y="70" opacity="0"><tspan fill="#8a2be2" font-weight="bold">host    </tspan><tspan fill="#4c1d95">::  </tspan><tspan fill="#ded4f5">Usamasg</tspan>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.3s" fill="freeze"/>
    </text>
    <text x="400" y="100" opacity="0"><tspan fill="#8a2be2" font-weight="bold">user    </tspan><tspan fill="#4c1d95">::  </tspan><tspan fill="#ded4f5">oussamasaidguerni-cyber</tspan>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.8s" fill="freeze"/>
    </text>
    <text x="400" y="130" opacity="0"><tspan fill="#8a2be2" font-weight="bold">os      </tspan><tspan fill="#4c1d95">::  </tspan><tspan fill="#ded4f5">kali + python (learning)</tspan>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.3s" fill="freeze"/>
    </text>
    <text x="400" y="160" opacity="0"><tspan fill="#8a2be2" font-weight="bold">learning</tspan><tspan fill="#4c1d95"> ::  </tspan><tspan fill="#ded4f5">OWASP Ten, SQLi, XSS, SOC</tspan>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.8s" fill="freeze"/>
    </text>
    <text x="400" y="190" opacity="0"><tspan fill="#8a2be2" font-weight="bold">projects</tspan><tspan fill="#4c1d95"> ::  </tspan><tspan fill="#ded4f5">usahack, logwatch</tspan>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.3s" fill="freeze"/>
    </text>
    <text x="400" y="220" opacity="0"><tspan fill="#8a2be2" font-weight="bold">motto   </tspan><tspan fill="#4c1d95">::  </tspan><tspan fill="#ded4f5">break it, learn it, build safe</tspan>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.8s" fill="freeze"/>
    </text>
  </g>

  <rect x="400" y="228" width="9" height="16" fill="#c4a5fc" opacity="0">
    <animate attributeName="opacity" values="0;1;0;1" dur="1s" repeatCount="indefinite" begin="3.6s"/>
  </rect>
</svg>
