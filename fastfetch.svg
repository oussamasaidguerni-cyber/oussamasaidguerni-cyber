  <text x="170" y="268" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="15" letter-spacing="4" fill="#d64550">yume &#8212; vision</text>

  <g font-family="'gothic','JetBrains Mono',Consolas,monospace" font-size="15">
