    <text x="400" y="270" opacity="0"><tspan fill="#d64550" font-weight="bold">me      </tspan><tspan fill="#7f1d1d">::  </tspan><tspan fill="#f0d5d8">oussamaSG,DZ,19, i can make shit happen :) </tspan>
