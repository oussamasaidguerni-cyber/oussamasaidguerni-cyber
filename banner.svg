  <rect x="555" y="45" width="325" height="122" rx="10" fill="#150a28" stroke="#7c3aed" stroke-width="1.5" opacity="0.95">
    <animate attributeName="opacity" values="0.95;0.8;0.95" dur="3s" repeatCount="indefinite"/>
  </rect>
  <circle cx="575" cy="65" r="4" fill="#a084dc"/>
  <circle cx="590" cy="65" r="4" fill="#7c3aed"/>
  <circle cx="605" cy="65" r="4" fill="#4c1d95"/>
  <text x="625" y="70" font-family="'Fira Code',Consolas,monospace" font-size="11" fill="#8f8fb0">bug_hunter@usahack:~</text>

  <g font-family="'Fira Code',Consolas,monospace" font-size="12.5">
    <text x="575" y="96" fill="#8f8fb0">$ recon target --stealth
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.5s" fill="freeze"/>
    </text>
    <text x="575" y="116" fill="#d0bfff">[+] 3 open ports detected
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2s" fill="freeze"/>
    </text>
    <text x="575" y="136" fill="#e3a8ff">[!] sqli found in /login
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.5s" fill="freeze"/>
    </text>
  </g>

  <rect x="743" y="128" width="7" height="13" fill="#c4a5fc">
    <animate attributeName="opacity" values="0;1;0;1" dur="0.9s" repeatCount="indefinite" begin="7s"/>
  </rect>

  <g font-family="'Fira Code',Consolas,monospace" font-size="12">
    <text x="300" y="-10" fill="#8a2be2">0101
      <animateTransform attributeName="transform" type="translate" values="0 0;0 280" dur="7s" repeatCount="indefinite" begin="0s"/>
      <animate attributeName="opacity" values="0;0.55;0" dur="7s" repeatCount="indefinite" begin="0s"/>
    </text>
    <text x="385" y="-10" fill="#a084dc">1010
      <animateTransform attributeName="transform" type="translate" values="0 0;0 280" dur="8s" repeatCount="indefinite" begin="-3s"/>
      <animate attributeName="opacity" values="0;0.55;0" dur="8s" repeatCount="indefinite" begin="-3s"/>
    </text>
    <text x="470" y="-10" fill="#7c3aed">0011
      <animateTransform attributeName="transform" type="translate" values="0 0;0 280" dur="6s" repeatCount="indefinite" begin="-1.5s"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="6s" repeatCount="indefinite" begin="-1.5s"/>
    </text>
  </g>

  <text x="250" y="240" font-family="'Fira Code',Consolas,monospace" font-size="10" letter-spacing="3" fill="#5b3a8f">AUTH :: MOTIVATED :: BUG HUNT MODE ON</text>
