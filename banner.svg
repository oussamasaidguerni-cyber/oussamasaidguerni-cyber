    </g>
    <circle cx="35" cy="47" r="6" fill="#c4a5fc">
      <animate attributeName="fill" values="#c4a5fc;#4c1d95;#c4a5fc" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="250" y="118" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="54" font-weight="900" fill="url(#namegg)" letter-spacing="3">Usamasg</text>

  <rect x="150" y="86" width="80" height="42" fill="url(#shimmer)">
    <animate attributeName="x" values="150;520" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.6;0" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <text x="250" y="150" font-family="'Fira Code',Consolas,monospace" font-size="15" letter-spacing="5" fill="#b083f0">ASPIRING CYBERSECURITY ENTHUSIAST</text>

  <g font-family="'Fira Code',Consolas,monospace" font-size="14" fill="#8f8fb0">
    <text x="250" y="186">$ whoami</text>
    <text x="250" y="208" fill="#c4a5fc">&gt; Usamasg</text>
  </g>

  <rect x="327" y="198" width="9" height="16" fill="#a084dc">
    <animate attributeName="opacity" values="0;1;0;1" dur="1s" repeatCount="indefinite" begin="2.4s"/>
