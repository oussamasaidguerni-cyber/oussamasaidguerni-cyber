<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Usamasg - Aspiring Cybersecurity Enthusiast and ethical hacking">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12081f"/>
      <stop offset="0.55" stop-color="#2d1460"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="namegg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4a5fc">
        <animate attributeName="stop-color" values="#c4a5fc;#7c3aed;#c4a5fc" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#7c3aed">
        <animate attributeName="stop-color" values="#7c3aed;#4c1d95;#7c3aed" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8a2be2" stop-opacity="0.4">
        <animate attributeName="stop-opacity" values="0.4;0.15;0.4" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#8a2be2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a2be2" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8a2be2" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8a2be2" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="260" fill="url(#bg)"/>
  <circle cx="450" cy="130" r="200" fill="url(#glow)"/>

  <g stroke="#3b1f6e" stroke-width="0.6" opacity="0.35">
    <path d="M 0 65 H 900 M 0 130 H 900 M 0 195 H 900"/>
    <path d="M 150 0 V 260 M 300 0 V 260 M 450 0 V 260 M 600 0 V 260 M 750 0 V 260"/>
  </g>

  <g fill="#c4a5fc">
    <circle cx="60" cy="30" r="1.5"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.2s" repeatCount="indefinite" begin="0s"/></circle>
    <circle cx="180" cy="18" r="1.3"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.7s" repeatCount="indefinite" begin="0.5s"/></circle>
    <circle cx="320" cy="28" r="1.6"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2s" repeatCount="indefinite" begin="1s"/></circle>
    <circle cx="500" cy="16" r="1.3"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.4s" repeatCount="indefinite" begin="0.3s"/></circle>
    <circle cx="640" cy="30" r="1.5"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.1s" repeatCount="indefinite" begin="0.8s"/></circle>
    <circle cx="820" cy="22" r="1.4"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3s" repeatCount="indefinite" begin="1.4s"/></circle>
    <circle cx="120" cy="120" r="1.4"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.6s" repeatCount="indefinite" begin="0.9s"/></circle>
    <circle cx="880" cy="150" r="1.5"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.3s" repeatCount="indefinite" begin="0.2s"/></circle>
    <circle cx="40" cy="230" r="1.4"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.8s" repeatCount="indefinite" begin="1.6s"/></circle>
    <circle cx="260" cy="245" r="1.3"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.1s" repeatCount="indefinite" begin="0.6s"/></circle>
  </g>

  <rect x="0" y="0" width="900" height="3" fill="url(#scan)" opacity="0.7">
    <animate attributeName="y" values="-6;266" dur="5s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="opacity" values="0;0.7;0" dur="5s" repeatCount="indefinite" begin="0s"/>
  </rect>
  <rect x="0" y="0" width="900" height="3" fill="url(#scan)" opacity="0.7">
    <animate attributeName="y" values="-6;266" dur="5s" repeatCount="indefinite" begin="-2.5s"/>
    <animate attributeName="opacity" values="0;0.7;0" dur="5s" repeatCount="indefinite" begin="-2.5s"/>
  </rect>

  <g transform="translate(140,60)">
    <circle cx="35" cy="60" r="30" fill="none" stroke="#8a2be2" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="30;62" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="2s" repeatCount="indefinite"/>
